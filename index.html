<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prime Protocol Secure Gateway</title>

  <!-- ================= MONETAG VIGNETTE BANNER (ZONE 12234670) ================= -->
  <script>(function(s){s.dataset.zone='12234670',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <!-- =========================================================================== -->

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.4);
      --text: #f9fafb;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #172554, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    /* iOS Liquid Glass Container */
    .portal-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(59, 130, 246, 0.15);
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #60a5fa;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Timer Graphic */
    .timer-circle-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-circle-wrap svg {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-circle-wrap circle {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
    }

    .circle-bg {
      stroke: rgba(255, 255, 255, 0.08);
    }

    .circle-progress {
      stroke: var(--accent);
      stroke-dasharray: 264;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
    }

    .timer-number {
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* Status Pill */
    .status-pill {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Action Button (Manual Click) */
    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      outline: none;
      cursor: not-allowed;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .action-btn.ready {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 25px -5px var(--accent-glow);
      animation: floatPulse 2.5s infinite;
    }

    .action-btn.ready:active {
      transform: scale(0.98);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0); box-shadow: 0 10px 25px -5px var(--accent-glow); }
      50% { transform: translateY(-2px); box-shadow: 0 15px 30px -2px rgba(59, 130, 246, 0.6); }
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="badge">
      <span class="badge-dot"></span>
      Prime Cloud Gateway
    </div>

    <h1>File Verification</h1>
    <p class="subtitle">Complete human security check to unlock high-speed cloud file delivery.</p>

    <!-- Circular 10-Second Timer -->
    <div class="timer-circle-wrap">
      <svg viewBox="0 0 100 100">
        <circle class="circle-bg" cx="50" cy="50" r="42"></circle>
        <circle class="circle-progress" id="circleProgress" cx="50" cy="50" r="42"></circle>
      </svg>
      <div class="timer-number" id="countdown">10</div>
    </div>

    <div class="status-pill" id="statusText">Verifying cloud token... Please wait.</div>

    <!-- Direct User Action Button (NO AUTO REDIRECT) -->
    <a href="javascript:void(0)" id="gatewayBtn" class="action-btn" target="_blank" rel="noopener noreferrer">
      <span id="btnIcon">⏳</span>
      <span id="btnText">Please wait 10s...</span>
    </a>

    <div class="footer-note">
      🔒 256-Bit SSL Protected • Powered by MahaStudy AI
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const BOT_USERNAME = "FILE_STOREB_BOT";
    const SHRTFLY_API_KEY = "f9daa0e2c84d39d3686c0d08691e4a62";
    let TOTAL_SECONDS = 10;
    let remainingTime = TOTAL_SECONDS;

    // 1. Resolve Target Code from Query / Pathname / Hash
    function getFileCode() {
      const urlParams = new URLSearchParams(window.location.search);
      let code = urlParams.get('file') || urlParams.get('code') || urlParams.get('id');
      
      if (!code && window.location.hash) {
        code = window.location.hash.replace('#', '').trim();
      }

      if (!code) {
        const pathSegments = window.location.pathname.split('/').filter(p => p.length > 0);
        if (pathSegments.length > 0 && pathSegments[0] !== 'index.html') {
          code = pathSegments[0];
        }
      }
      return code || "session";
    }

    const fileCode = getFileCode();
    
    // Telegram return destination once Shrtfly verification is complete
    const telegramReturnLink = `https://t.me/${BOT_USERNAME}?start=v_${fileCode}`;
    
    // Target Shrtfly Gateway Link
    const targetShortlink = `https://shrtfly.com/st?api=${SHRTFLY_API_KEY}&url=${encodeURIComponent(telegramReturnLink)}`;

    // DOM Elements
    const countdownEl = document.getElementById('countdown');
    const statusTextEl = document.getElementById('statusText');
    const gatewayBtn = document.getElementById('gatewayBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const circleProgress = document.getElementById('circleProgress');
    const circumference = 2 * Math.PI * 42; // r=42 (~263.89)

    circleProgress.style.strokeDasharray = `${circumference}`;
    circleProgress.style.strokeDashoffset = `0`;

    // 2. Countdown Loop (Strictly 10 Seconds, Manual Click Unlock)
    const timerInterval = setInterval(() => {
      remainingTime--;

      if (remainingTime > 0) {
        countdownEl.innerText = remainingTime;
        btnText.innerText = `Please wait ${remainingTime}s...`;

        // Update SVG circle stroke
        const progressOffset = circumference - (remainingTime / TOTAL_SECONDS) * circumference;
        circleProgress.style.strokeDashoffset = progressOffset;
      } else {
        clearInterval(timerInterval);
        countdownEl.innerText = "✓";
        countdownEl.style.color = "var(--success)";
        circleProgress.style.stroke = "var(--success)";
        circleProgress.style.strokeDashoffset = circumference;

        statusTextEl.innerText = "Link is ready! Tap below to verify.";
        statusTextEl.style.color = "#34d399";

        // Unlock Button for User Click
        gatewayBtn.classList.add('ready');
        gatewayBtn.href = targetShortlink;
        btnIcon.innerText = "🚀";
        btnText.innerText = "Continue to Verification ➔";
      }
    }, 1000);
  </script>
</body>
</html>
