<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification Gateway | AT-X Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b, #0f172a 70%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid #6366f1;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #818cf8;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .timer-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .countdown {
      font-size: 2.25rem;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }
    .timer-label {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.25rem;
    }
    .btn {
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .btn-ready {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
    }
    .btn-ready:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.7);
    }
    .info-footer {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: #64748b;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Shield Gateway Active</div>
    <h1>Security Check</h1>
    <p>Please wait a few seconds while our system verifies your connection and prepares your protected download link.</p>

    <div class="timer-box">
      <div id="countdown" class="countdown">5</div>
      <div class="timer-label">Checking security parameters...</div>
    </div>

    <button id="verifyBtn" class="btn btn-disabled" disabled onclick="redirectToLiteShort()">
      ⏳ Please Wait (5s)
    </button>

    <div class="info-footer">
      <span class="dot"></span>
      Protected by Prime Verify Gateway
    </div>
  </div>

  <script>
    // 1. Read URL parameter (?file=f_xxxx)
    const urlParams = new URLSearchParams(window.location.search);
    const fileCode = urlParams.get('file');

    let timeLeft = 5;
    const countdownEl = document.getElementById("countdown");
    const verifyBtn = document.getElementById("verifyBtn");

    // 2. Run countdown timer
    const timerInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        countdownEl.innerText = timeLeft;
        verifyBtn.innerText = `⏳ Please Wait (${timeLeft}s)`;
      } else {
        clearInterval(timerInterval);
        countdownEl.innerText = "0";
        verifyBtn.disabled = false;
        verifyBtn.className = "btn btn-ready";
        verifyBtn.innerText = "🚀 Continue to Secure Link";
      }
    }, 1000);

    // 3. Fetch backend redirect generated via Cloudflare Functions
    async function redirectToLiteShort() {
      if (!fileCode) {
        alert("Invalid or missing file code parameter!");
        return;
      }

      verifyBtn.innerText = "🔄 Generating Link...";
      verifyBtn.disabled = true;

      try {
        const response = await fetch(`/redirect?file=${encodeURIComponent(fileCode)}`);
        const data = await response.json();

        if (data && data.redirectUrl) {
          window.location.href = data.redirectUrl;
        } else {
          alert("Error generating access gateway. Please refresh.");
          verifyBtn.disabled = false;
          verifyBtn.innerText = "🚀 Continue to Secure Link";
        }
      } catch (err) {
        alert("Network error: " + err.message);
        verifyBtn.disabled = false;
        verifyBtn.innerText = "🚀 Continue to Secure Link";
      }
    }
  </script>

</body>
</html>
