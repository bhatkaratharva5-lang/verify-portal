<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Verification Portal</title>
  <style>
    :root {
      --ios-system-blue: #007AFF;
      --ios-system-indigo: #5856D6;
      --ios-glass-surface: rgba(255, 255, 255, 0.12);
      --ios-glass-border: rgba(255, 255, 255, 0.22);
      --ios-label-primary: #FFFFFF;
      --ios-label-secondary: rgba(235, 235, 245, 0.65);
      --ios-label-tertiary: rgba(235, 235, 245, 0.40);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #0B0E14;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Liquid Blobs Background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      will-change: transform;
      animation: floatLiquid 12s infinite ease-in-out alternate;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #007AFF 0%, #00C6FF 100%);
      top: -80px;
      left: -60px;
    }

    .blob-2 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #7928CA 0%, #FF0080 100%);
      bottom: -100px;
      right: -80px;
      animation-duration: 16s;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, #5856D6 0%, #30B0C7 100%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.35;
      animation-duration: 10s;
      animation-delay: -2s;
    }

    @keyframes floatLiquid {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
      100% { transform: translate(-25px, 25px) scale(0.95); }
    }

    /* iOS Frosted Glass Container */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      background: var(--ios-glass-surface);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border-radius: 36px;
      border: 1px solid var(--ios-glass-border);
      padding: 38px 28px 30px;
      text-align: center;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Glass Pill Icon */
    .shield-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 122, 255, 0.25);
    }

    .shield-icon {
      width: 28px;
      height: 28px;
      stroke: #FFFFFF;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--ios-label-primary);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 15px;
      line-height: 1.45;
      color: var(--ios-label-secondary);
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* Specular Glass Panel for File Details */
    .file-pill {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .pill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--ios-label-tertiary);
    }

    .status-text {
      color: #34C759;
      font-weight: 700;
    }

    .file-code-val {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 600;
      color: #70C0FF;
      word-break: break-all;
    }

    /* iOS Native Primary Action Button */
    .liquid-btn {
      width: 100%;
      height: 54px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(180deg, #0A84FF 0%, #0066D6 100%);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 
        0 10px 25px rgba(10, 132, 255, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-btn:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 14px 30px rgba(10, 132, 255, 0.55);
    }

    .liquid-btn:active:not(:disabled) {
      transform: scale(0.97);
      background: #0056B3;
    }

    .liquid-btn:disabled {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.35);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Fallback Manual Input */
    .ios-input {
      width: 100%;
      height: 48px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      color: #FFFFFF;
      padding: 0 16px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      display: none;
      transition: border-color 0.2s ease;
    }

    .ios-input:focus {
      border-color: #0A84FF;
    }

    /* iOS Native Spinner */
    .ios-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.75s linear infinite;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: var(--ios-label-tertiary);
      letter-spacing: -0.1px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Ambient Fluid Lighting -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="liquid-card">
    <div class="shield-badge">
      <svg class="shield-icon" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <h1>File Verification</h1>
    <p class="subtitle">Complete the fast security check to unlock your file directly in Telegram.</p>

    <div class="file-pill">
      <div class="pill-header">
        <span>Cloud Payload</span>
        <span id="statusIndicator" class="status-text">Checking...</span>
      </div>
      <div id="fileDisplay" class="file-code-val">Resolving Identifier...</div>
    </div>

    <input type="text" id="manualInput" class="ios-input" placeholder="Paste file code (e.g. file9x8k7l)">

    <button id="actionBtn" class="liquid-btn" disabled>
      <span id="btnSpinner" class="ios-spinner"></span>
      <span id="btnLabel">Preparing Link...</span>
    </button>

    <p class="footer-note">Encrypted End-to-End • Shrtfly Verified</p>
  </main>

  <script>
    const BOT_USERNAME = "FILE_STOREB_BOT";

    // Multi-way parser: Extracts code from queries, hashes, pathnames, and raw strings
    function resolveFileCode() {
      // 1. Standard search parameters (?file=... or ?f=...)
      const params = new URLSearchParams(window.location.search);
      let found = params.get("file") || params.get("f");
      if (found) return found.trim();

      // 2. Raw query string regex match
      const rawSearch = window.location.search;
      if (rawSearch) {
        const m = rawSearch.match(/(?:file|f)=([a-zA-Z0-9_-]+)/i);
        if (m && m[1]) return m[1].trim();
      }

      // 3. Hash fragment (#file=... or #f_...)
      if (window.location.hash) {
        const hashMatch = window.location.hash.match(/(?:file|f)=([a-zA-Z0-9_-]+)/i);
        if (hashMatch && hashMatch[1]) return hashMatch[1].trim();
      }

      // 4. Clean Pathname (/filexxxx or /f_xxxx)
      const pathSegments = window.location.pathname.split("/").filter(Boolean);
      for (const seg of pathSegments) {
        if (seg.startsWith("file") || seg.startsWith("f_")) {
          return seg.trim();
        }
      }

      return null;
    }

    const code = resolveFileCode();
    const statusIndicator = document.getElementById("statusIndicator");
    const fileDisplay = document.getElementById("fileDisplay");
    const actionBtn = document.getElementById("actionBtn");
    const btnSpinner = document.getElementById("btnSpinner");
    const btnLabel = document.getElementById("btnLabel");
    const manualInput = document.getElementById("manualInput");

    if (!code) {
      statusIndicator.textContent = "Action Required";
      statusIndicator.style.color = "#FF9F0A";
      fileDisplay.textContent = "No file code found";
      fileDisplay.style.color = "rgba(235, 235, 245, 0.6)";
      
      btnSpinner.style.display = "none";
      btnLabel.textContent = "Enter Code";
      manualInput.style.display = "block";
      actionBtn.disabled = false;

      actionBtn.addEventListener("click", () => {
        const val = manualInput.value.trim();
        if (val) {
          window.location.search = "?file=" + encodeURIComponent(val);
        }
      });
    } else {
      statusIndicator.textContent = "Locked";
      statusIndicator.style.color = "#0A84FF";
      fileDisplay.textContent = code;
      initiateFlow(code);
    }

    async function initiateFlow(fileId) {
      const telegramTarget = `https://t.me/${BOT_USERNAME}?start=v_${fileId}`;
      let destinationUrl = telegramTarget;

      try {
        const res = await fetch(`/redirect?file=${encodeURIComponent(fileId)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.redirectUrl) {
            destinationUrl = data.redirectUrl;
          }
        }
      } catch (e) {
        console.warn("Direct worker lookup unavailable, using fallback route:", e);
      }

      btnSpinner.style.display = "none";
      btnLabel.textContent = "Continue to Unlock";
      actionBtn.disabled = false;

      actionBtn.addEventListener("click", () => {
        window.location.href = destinationUrl;
      });

      // Smooth auto-redirect after 2.5 seconds
      setTimeout(() => {
        if (code) {
          window.location.href = destinationUrl;
        }
      }, 2500);
    }
  </script>

</body>
</html>
