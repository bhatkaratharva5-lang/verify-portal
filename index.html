<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIME GATEWAY // CYBER SECURITY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-purple: #bc13fe;
      --cyber-black: #060814;
      --card-bg: rgba(10, 14, 29, 0.92);
      --border-cyan: rgba(0, 243, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--cyber-black);
      background-image: 
        radial-gradient(ellipse at 50% -20%, rgba(188, 19, 254, 0.35), transparent 60%),
        radial-gradient(ellipse at 80% 120%, rgba(0, 243, 255, 0.25), transparent 50%),
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 35px 35px, 35px 35px;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: " ";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }

    .cyber-card {
      background: var(--card-bg);
      border: 1px solid var(--border-cyan);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(188, 19, 254, 0.1);
      border-radius: 12px;
      padding: 34px 26px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      position: relative;
      backdrop-filter: blur(12px);
      z-index: 2;
      clip-path: polygon(
        0 14px, 
        14px 0, 
        calc(100% - 14px) 0, 
        100% 14px, 
        100% calc(100% - 14px), 
        calc(100% - 14px) 100%, 
        14px 100%, 
        0 calc(100% - 14px)
      );
    }

    .cyber-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-top: 2px solid var(--neon-cyan);
      border-bottom: 2px solid var(--neon-pink);
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: pulse 1.2s infinite alternate;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 15px;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .holo-panel {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-left: 3px solid var(--neon-pink);
      padding: 14px 12px;
      margin-bottom: 24px;
      text-align: left;
    }

    .holo-header {
      display: flex;
      justify-content: space-between;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--neon-pink);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .holo-content {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      word-break: break-all;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    .manual-input {
      width: 100%;
      background: #090d1a;
      border: 1px solid var(--neon-cyan);
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      padding: 12px;
      margin-bottom: 16px;
      outline: none;
      border-radius: 6px;
      display: none;
    }

    .cyber-btn {
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.85), rgba(188, 19, 254, 0.95));
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid var(--neon-pink);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .cyber-btn:hover:not(:disabled) {
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.8), 0 0 15px var(--neon-cyan);
      transform: translateY(-2px);
    }

    .cyber-btn:disabled {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #475569;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--neon-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .footer {
      margin-top: 22px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: #64748b;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="cyber-card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>SYSTEM // SECURE CHECK</span>
    </div>

    <h1>ACCESS GATEWAY</h1>
    <p class="subtitle">Complete sponsored encryption bypass to decrypt your cloud payload.</p>

    <div class="holo-panel">
      <div class="holo-header">
        <span>SECURITY ENCLAVE</span>
        <span id="statusBadge">STATUS: CHECKING</span>
      </div>
      <div class="holo-content" id="fileCodeDisplay">LOCATING PAYLOAD...</div>
    </div>

    <input type="text" id="manualCode" class="manual-input" placeholder="ENTER FILE CODE (e.g. file9x8k7l)">

    <button id="verifyBtn" class="cyber-btn" disabled>
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">BOOTING CORE...</span>
    </button>

    <div class="footer">
      PRIME PROTOCOL // ENCRYPTED VIA SHRTFLY
    </div>
  </div>

  <script>
    const BOT_USERNAME = "FILE_STOREB_BOT";

    // Multi-source extractor: checks search query, hash, pathname, and raw string
    function extractCode() {
      // 1. Standard URLSearchParams (?file=... or ?f=...)
      const urlParams = new URLSearchParams(window.location.search);
      let code = urlParams.get("file") || urlParams.get("f");
      if (code) return code.trim();

      // 2. Raw query string regex check (in case searchParams failed decoding)
      const rawSearch = window.location.search;
      if (rawSearch) {
        const m = rawSearch.match(/(?:file|f)=([a-zA-Z0-9_-]+)/i);
        if (m && m[1]) return m[1].trim();
      }

      // 3. Hash routing check (#file=... or #f_...)
      if (window.location.hash) {
        const hashMatch = window.location.hash.match(/(?:file|f)=([a-zA-Z0-9_-]+)/i);
        if (hashMatch && hashMatch[1]) return hashMatch[1].trim();
      }

      // 4. Pathname check (/filexxxx or /f_xxxx)
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      for (let p of pathParts) {
        if (p.startsWith("file") || p.startsWith("f_")) {
          return p.trim();
        }
      }

      return null;
    }

    const fileCode = extractCode();
    const fileDisplay = document.getElementById("fileCodeDisplay");
    const statusBadge = document.getElementById("statusBadge");
    const verifyBtn = document.getElementById("verifyBtn");
    const btnSpinner = document.getElementById("btnSpinner");
    const btnText = document.getElementById("btnText");
    const manualInput = document.getElementById("manualCode");

    if (!fileCode) {
      statusBadge.textContent = "STATUS: NO CODE";
      statusBadge.style.color = "#ff0055";
      fileDisplay.textContent = "PLEASE ENTER FILE CODE BELOW";
      fileDisplay.style.color = "#ff0055";
      btnSpinner.style.display = "none";
      btnText.textContent = "VERIFY CODE";
      manualInput.style.display = "block";
      verifyBtn.disabled = false;

      verifyBtn.addEventListener("click", () => {
        const entered = manualInput.value.trim();
        if (entered) {
          window.location.search = "?file=" + encodeURIComponent(entered);
        }
      });
    } else {
      statusBadge.textContent = "STATUS: LOCKED";
      statusBadge.style.color = "#00f3ff";
      fileDisplay.textContent = "TARGET: " + fileCode;
      bootGateway(fileCode);
    }

    async function bootGateway(code) {
      const telegramTarget = `https://t.me/${BOT_USERNAME}?start=v_${code}`;
      let finalTarget = telegramTarget;

      try {
        const res = await fetch(`/redirect?file=${encodeURIComponent(code)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.redirectUrl) {
            finalTarget = data.redirectUrl;
          }
        }
      } catch (err) {
        console.warn("Backend function skipped, direct fallback applied:", err);
      }

      btnSpinner.style.display = "none";
      btnText.textContent = "INITIALIZE DOWNLOAD ▶";
      verifyBtn.disabled = false;

      verifyBtn.addEventListener("click", () => {
        window.location.href = finalTarget;
      });

      // Smooth auto-redirect after 2.8 seconds
      setTimeout(() => {
        if (fileCode) {
          window.location.href = finalTarget;
        }
      }, 2800);
    }
  </script>

</body>
</html>
