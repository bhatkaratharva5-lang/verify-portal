<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Verify Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
    .status { font-size: 20px; font-weight: bold; color: #38bdf8; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: #0284c7;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Prime Shield Gate</div>
    <h2>Security Verification</h2>
    <p>Verifying secure connection. Please wait before proceeding to the ad sponsor.</p>
    <div id="countdown" class="status">Verifying in 5s...</div>
    <a id="proceedBtn" class="btn" style="display: none;" href="#">Continue</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const encodedGo = params.get('go');
  const tok = params.get('tok');
  const code = params.get('code') || 'none';
  const uid = params.get('uid') || '0';
  const botName = "FILE_STOREB_BOT";

  let destination = null;

  // Case 1: Shielded LiteShort link passed via ?go=
  if (encodedGo) {
    try {
      destination = atob(decodeURIComponent(encodedGo));
    } catch (e) {
      destination = null;
    }
  } 
  // Case 2: Returning from LiteShort verification back to Bot
  else if (tok) {
    destination = `https://t.me/${botName}?start=v_${tok}_${code}_${uid}`;
  }

  let seconds = 5;
  const countdownEl = document.getElementById('countdown');
  const proceedBtn = document.getElementById('proceedBtn');

  if (!destination) {
    countdownEl.innerText = "Error: Invalid link";
    countdownEl.style.color = "#f87171";
  } else {
    proceedBtn.href = destination;

    const timer = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        countdownEl.innerText = `Redirecting in ${seconds}s...`;
      } else {
        clearInterval(timer);
        countdownEl.innerText = "Proceeding...";
        proceedBtn.style.display = "inline-block";
        window.location.href = destination;
      }
    }, 1000);
  }
</script>

</body>
</html>
