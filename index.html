<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Verify Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
    .status { font-size: 20px; font-weight: bold; color: #38bdf8; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: #0284c7;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Prime Verify Portal</div>
    <h2>Security Check</h2>
    <p>Please wait while we verify your session before proceeding to the ad sponsor.</p>
    <div id="countdown" class="status">Starting in 5s...</div>
    <a id="proceedBtn" class="btn" style="display: none;" href="#">Click here if not redirected</a>
  </div>

<script>
  // 1. Read the short link passed from the bot
  const params = new URLSearchParams(window.location.search);
  const nextUrl = params.get('next');

  let seconds = 5;
  const countdownEl = document.getElementById('countdown');
  const proceedBtn = document.getElementById('proceedBtn');

  if (!nextUrl) {
    countdownEl.innerText = "Error: Invalid link";
    countdownEl.style.color = "#f87171";
  } else {
    proceedBtn.href = nextUrl;

    const timer = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        countdownEl.innerText = `Starting in ${seconds}s...`;
      } else {
        clearInterval(timer);
        countdownEl.innerText = "Redirecting to ad sponsor...";
        proceedBtn.style.display = "inline-block";
        // Automatically forward to LiteShort
        window.location.href = nextUrl;
      }
    }, 1000);
  }
</script>

</body>
</html>
