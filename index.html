<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Security Verification Portal</title>
  <style>
    :root {
      --ios-blue: #007AFF;
      --ios-glass: rgba(255, 255, 255, 0.12);
      --ios-border: rgba(255, 255, 255, 0.22);
      --ios-text: #FFFFFF;
      --ios-sub: rgba(235, 235, 245, 0.65);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0B0E14;
      position: relative;
      overflow: hidden;
    }
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: floatLiquid 12s infinite alternate ease-in-out;
    }
    .blob-1 { width: 320px; height: 320px; background: radial-gradient(circle, #007AFF, #00C6FF); top: -80px; left: -60px; }
    .blob-2 { width: 360px; height: 360px; background: radial-gradient(circle, #7928CA, #FF0080); bottom: -100px; right: -80px; animation-duration: 15s; }
    @keyframes floatLiquid {
      0% { transform: translate(0, 0); }
      100% { transform: translate(25px, -30px); }
    }
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      background: var(--ios-glass);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border-radius: 34px;
      border: 1px solid var(--ios-border);
      padding: 38px 28px 32px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    }
    .badge-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 122, 255, 0.3);
    }
    .badge-icon svg {
      width: 30px;
      height: 30px;
      stroke: #FFFFFF;
      stroke-width: 2.2;
      fill: none;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      line-height: 1.45;
      color: var(--ios-sub);
      margin-bottom: 24px;
    }
    .file-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .file-id-text {
      font-family: ui-monospace, Menlo, monospace;
      color: #70C0FF;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      height: 54px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(180deg, #0A84FF 0%, #0066D6 100%);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(10, 132, 255, 0.45);
      transition: all 0.2s ease;
    }
    .btn:active { transform: scale(0.97); }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(235, 235, 245, 0.4);
    }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="card">
    <div class="badge-icon">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>

    <h1>File Verification</h1>
    <p>Complete the sponsored security pass to decrypt your file and unlock Telegram access.</p>

    <div class="file-box">
      <span style="color: rgba(235, 235, 245, 0.5);">Payload:</span>
      <span id="fileCodeDisplay" class="file-id-text">Detecting...</span>
    </div>

    <button id="verifyBtn" class="btn">
      <span>Continue to Unlock ▶</span>
    </button>

    <div class="footer">Encrypted Verification • Shrtfly Verified</div>
  </main>

  <script>
    const BOT_USERNAME = "FILE_STOREB_BOT";
    const SHRTFLY_API_KEY = "f9daa0e2c84d39d3686c0d08691e4a62";

    // Multi-way parser: Extracts code from query, regex href, or pathname
    function getFileCode() {
      const params = new URLSearchParams(window.location.search);
      let c = params.get("file") || params.get("f");
      if (c && c.trim()) return c.trim();

      const fullUrl = window.location.href;
      const match = fullUrl.match(/[?&#/](file[a-z0-9]+|f_[a-z0-9]+)/i);
      if (match && match[1]) return match[1].trim();

      const parts = window.location.pathname.split("/").filter(Boolean);
      for (let p of parts) {
        if (p.startsWith("file") || p.startsWith("f_")) return p.trim();
      }

      return null;
    }

    const code = getFileCode();
    const display = document.getElementById("fileCodeDisplay");
    const btn = document.getElementById("verifyBtn");

    // Seamless fallback to session pass if query is stripped
    const activeCode = code ? code : "session";
    display.textContent = activeCode;

    // Build Shrtfly monetized target
    const telegramReturn = "https://t.me/" + BOT_USERNAME + "?start=v_" + encodeURIComponent(activeCode);
    const shrtflyUrl = "https://shrtfly.com/st?api=" + SHRTFLY_API_KEY + "&url=" + encodeURIComponent(telegramReturn);

    btn.onclick = () => {
      window.location.href = shrtflyUrl;
    };

    // Auto-forward after 1.8 seconds
    setTimeout(() => {
      window.location.href = shrtflyUrl;
    }, 1800);
  </script>
</body>
</html>
