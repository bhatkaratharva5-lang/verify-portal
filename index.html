<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Verification Gateway</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #111827, #030712);
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 30px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .file-box {
      background: #111827;
      border: 1px dashed #4b5563;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #6b7280;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">🛡️ SECURE VERIFICATION</div>
    <h1>Verify to Unlock File</h1>
    <p>Complete the quick sponsored security check to decrypt your file and unlock 24-hour instant Telegram access.</p>

    <div class="file-box" id="fileCodeDisplay">Checking file parameters...</div>

    <button id="verifyBtn" class="btn" disabled>
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">Preparing Gateway...</span>
    </button>

    <div class="footer">
      Protected by Prime Security Gateway • Shrfly Verified
    </div>
  </div>

  <script>
    // ==============================================================
    // CONFIGURATION
    // ==============================================================
    const SHRFLY_API_KEY = "YOUR_SHRFLY_API_KEY_HERE"; // <-- PUT YOUR SHRFLY API KEY HERE
    const BOT_USERNAME = "FILE_STOREB_BOT";

    // 1. Extract File Parameter from URL (?file=f_xxxxxx)
    const urlParams = new URLSearchParams(window.location.search);
    const fileCode = urlParams.get("file");

    const fileDisplay = document.getElementById("fileCodeDisplay");
    const verifyBtn = document.getElementById("verifyBtn");
    const btnSpinner = document.getElementById("btnSpinner");
    const btnText = document.getElementById("btnText");

    if (!fileCode) {
      fileDisplay.textContent = "❌ Invalid or Missing File Code";
      fileDisplay.style.color = "#ef4444";
      btnSpinner.style.display = "none";
      btnText.textContent = "Cannot Proceed";
    } else {
      fileDisplay.textContent = "FILE ID: " + fileCode;
      initGateway();
    }

    // 2. Build Shrfly Gateway
    async function initGateway() {
      const destination = `https://t.me/${BOT_USERNAME}?start=v_${fileCode}`;
      
      // Shrfly Quick Link API Endpoint
      const shrflyApi = `https://shrfly.com/api?api=${encodeURIComponent(SHRFLY_API_KEY)}&url=${encodeURIComponent(destination)}`;

      let finalRedirectUrl = destination;

      try {
        const response = await fetch(shrflyApi);
        const data = await response.json();

        if (data && (data.status === "success" || data.shortenedUrl)) {
          finalRedirectUrl = data.shortenedUrl;
        } else {
          // If direct API JSON returns an alternative structure
          finalRedirectUrl = `https://shrfly.com/st?api=${encodeURIComponent(SHRFLY_API_KEY)}&url=${encodeURIComponent(destination)}`;
        }
      } catch (err) {
        // Fallback if browser blocks client-side API requests: Direct Shrfly link formulation
        finalRedirectUrl = `https://shrfly.com/st?api=${encodeURIComponent(SHRFLY_API_KEY)}&url=${encodeURIComponent(destination)}`;
      }

      // Ready State: Enable Button
      btnSpinner.style.display = "none";
      btnText.textContent = "🚀 Click Here to Verify & Unlock";
      verifyBtn.disabled = false;

      verifyBtn.addEventListener("click", () => {
        window.location.href = finalRedirectUrl;
      });
    }
  </script>

</body>
</html>
