<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Portal</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      border: 1px solid #334155;
    }
    h2 { margin-bottom: 10px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .status {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 15px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: #0284c7;
      color: white;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Security Verification</h2>
  <p>Verifying session... You will be redirected to the bot automatically.</p>
  <div id="countdown" class="status">Redirecting in 5s...</div>
  <a id="manualBtn" class="btn" style="display: none;" href="#">Click here if not redirected</a>
</div>

<script>
  // Read clean parameters from the landing URL
  const params = new URLSearchParams(window.location.search);
  const tok = params.get('tok') || '';
  const code = params.get('code') || '';
  const uid = params.get('uid') || '';

  const botName = "FILE_STOREB_BOT";
  const targetUrl = `https://t.me/${botName}?start=v_${tok}_${code}_${uid}`;

  let seconds = 5;
  const countdownEl = document.getElementById('countdown');
  const manualBtn = document.getElementById('manualBtn');

  const timer = setInterval(() => {
    seconds--;
    if (seconds > 0) {
      countdownEl.innerText = `Redirecting in ${seconds}s...`;
    } else {
      clearInterval(timer);
      countdownEl.innerText = "Redirecting now...";
      manualBtn.href = targetUrl;
      manualBtn.style.display = "inline-block";

      // Direct automatic redirect to bot
      window.location.href = targetUrl;
    }
  }, 1000);
</script>

</body>
</html>
