<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Link Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    p.desc { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.4; }
    .form-group { margin-bottom: 18px; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #334155; cursor: not-allowed; color: #64748b; }
    .output-box {
      margin-top: 24px;
      padding: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      display: none;
    }
    .output-box p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
    .link-display {
      word-break: break-all;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.95rem;
      padding: 10px;
      background: #1e293b;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .copy-btn {
      width: 100%;
      padding: 10px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn:hover { background: #16a34a; }
    .status-err { color: #f87171; font-size: 0.85rem; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">Prime Verify Portal Generator</div>
  <h1>Shorten & Protect Link</h1>
  <p class="desc">Paste your API key and file details to automatically create a protected LiteShort link routed through your Prime Verify Portal.</p>

  <div class="form-group">
    <label for="apiKey">LiteShort API Token</label>
    <input type="text" id="apiKey" placeholder="Enter your LiteShort API Key">
  </div>

  <div class="form-group">
    <label for="fileCode">File / Code Parameter (Optional)</label>
    <input type="text" id="fileCode" placeholder="e.g. file_123 or none">
  </div>

  <div class="form-group">
    <label for="uid">Telegram User ID (Optional)</label>
    <input type="text" id="uid" placeholder="e.g. 123456789">
  </div>

  <button id="genBtn" class="btn">Generate Protected Link</button>
  <div id="statusErr" class="status-err"></div>

  <div id="outputBox" class="output-box">
    <p>Your Protected Shortener Link:</p>
    <div id="linkDisplay" class="link-display"></div>
    <button id="copyBtn" class="copy-btn">📋 Copy Link</button>
  </div>
</div>

<script>
  const GATE_BASE = "https://prime-verify-portal.pages.dev";
  const genBtn = document.getElementById("genBtn");
  const outputBox = document.getElementById("outputBox");
  const linkDisplay = document.getElementById("linkDisplay");
  const copyBtn = document.getElementById("copyBtn");
  const statusErr = document.getElementById("statusErr");

  // Load saved API key from localStorage if available
  const savedKey = localStorage.getItem("liteshort_api_key");
  if (savedKey) {
    document.getElementById("apiKey").value = savedKey;
  }

  genBtn.addEventListener("click", async () => {
    statusErr.style.display = "none";
    outputBox.style.display = "none";

    const key = document.getElementById("apiKey").value.trim();
    const code = document.getElementById("fileCode").value.trim() || "none";
    const uid = document.getElementById("uid").value.trim() || "0";

    if (!key) {
      statusErr.innerText = "Please provide your LiteShort API token.";
      statusErr.style.display = "block";
      return;
    }

    // Save key locally for quick reuse
    localStorage.setItem("liteshort_api_key", key);

    // 1. Generate one-time security token
    const tok = Math.random().toString(36).slice(2, 10);

    // 2. Assemble the target URL to Prime Verify Portal
    const targetUrl = `${GATE_BASE}/?tok=${tok}&code=${encodeURIComponent(code)}&uid=${uid}`;

    // 3. Request shortened URL through proxy/API
    genBtn.disabled = true;
    genBtn.innerText = "Generating link...";

    try {
      const apiEndpoint = `https://liteshort.com/api?api=${key}&url=${encodeURIComponent(targetUrl)}&type=1`;
      
      // Use corsproxy fallback if direct browser fetch is blocked by CORS
      let finalShortUrl = null;
      try {
        const response = await fetch(apiEndpoint);
        const data = await response.json();
        if (data && (data.shortenedUrl || data.short_url)) {
          finalShortUrl = data.shortenedUrl || data.short_url;
        }
      } catch (corsErr) {
        // Fallback for browser CORS restrictions
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiEndpoint)}`;
        const pResponse = await fetch(proxyUrl);
        const pData = await pResponse.json();
        if (pData && (pData.shortenedUrl || pData.short_url)) {
          finalShortUrl = pData.shortenedUrl || pData.short_url;
        }
      }

      if (finalShortUrl) {
        linkDisplay.innerText = finalShortUrl;
        outputBox.style.display = "block";
      } else {
        throw new Error("Invalid API key or LiteShort rejected the request.");
      }
    } catch (err) {
      statusErr.innerText = "Error: " + err.message;
      statusErr.style.display = "block";
    } finally {
      genBtn.disabled = false;
      genBtn.innerText = "Generate Protected Link";
    }
  });

  copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(linkDisplay.innerText);
    copyBtn.innerText = "✅ Copied!";
    setTimeout(() => { copyBtn.innerText = "📋 Copy Link"; }, 2000);
  });
</script>

</body>
</html>
